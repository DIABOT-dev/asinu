name: ASINU EAS Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile to use
        type: choice
        options:
          - development
          - preview
          - production
        default: preview
      platform:
        description: Target platform
        type: choice
        options:
          - android
          - ios
          - all
        default: ios

jobs:
  eas-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.18.1"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Trigger EAS build
        run: |
          eas build \
            --platform ${{ inputs.platform }} \
            --profile ${{ inputs.profile }} \
            --non-interactive \
            --wait

      - name: Show latest build
        run: |
          eas build:list --status finished --limit 1
