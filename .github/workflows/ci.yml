name: Mobile CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: asinu-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      ASINU_BACKEND_DIR: _contracts/backend.asinu
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout backend API routes
        uses: actions/checkout@v7
        with:
          repository: DIABOT-dev/backend.asinu
          ref: main
          path: _contracts/backend.asinu

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.18.1"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Security regressions and dependency patches
        run: npm run test:security

      - name: Full API contract
        run: npm run test:api-contract

      - name: Check-in API contract
        run: npm run test:checkin-contract

      - name: Check-in native readiness
        run: npm run test:checkin-native

      - name: Check-in state, signaling and audio regressions
        run: |
          npm run test:checkin-state
          npm run test:checkin-connection
          npm run test:checkin-audio

      - name: Interaction and navigation check
        run: npm run test:interactions

      - name: Care Circle health access and calendar regressions
        run: npm run test:care-circle-health

      - name: i18n check
        run: npm run i18n:check

      - name: Asset reference check
        run: npm run lint:assets

      - name: ESLint
        run: npm run lint

      - name: Expo iOS bundle check
        env:
          EXPO_PUBLIC_APP_ENV: staging
          EXPO_PUBLIC_API_BASE_URL: https://asinu.top
          NODE_ENV: production
        run: |
          export_dir="${RUNNER_TEMP}/asinu-ios-export"
          node ./node_modules/expo/bin/cli export \
            --platform ios \
            --output-dir "$export_dir"

      - name: Expo Android bundle check
        env:
          EXPO_PUBLIC_APP_ENV: staging
          EXPO_PUBLIC_API_BASE_URL: https://asinu.top
          NODE_ENV: production
        run: |
          export_dir="${RUNNER_TEMP}/asinu-android-export"
          node ./node_modules/expo/bin/cli export \
            --platform android \
            --output-dir "$export_dir"
