name: Mobile CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: asinu-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.18.1"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: i18n check
        run: npm run i18n:check

      - name: Asset reference check
        run: npm run lint:assets

      - name: ESLint
        run: npm run lint

      - name: Expo iOS bundle check
        env:
          EXPO_PUBLIC_APP_ENV: staging
          EXPO_PUBLIC_API_BASE_URL: https://asinu.top
          NODE_ENV: production
        run: |
          export_dir="${RUNNER_TEMP}/asinu-ios-export"
          node ./node_modules/expo/bin/cli export \
            --platform ios \
            --output-dir "$export_dir"

      - name: Expo Android bundle check
        env:
          EXPO_PUBLIC_APP_ENV: staging
          EXPO_PUBLIC_API_BASE_URL: https://asinu.top
          NODE_ENV: production
        run: |
          export_dir="${RUNNER_TEMP}/asinu-android-export"
          node ./node_modules/expo/bin/cli export \
            --platform android \
            --output-dir "$export_dir"
